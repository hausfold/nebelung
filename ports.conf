# name | template | output subdir under dist/
# Whiskers ports re-rendered against every variant in palette/variants.json —
# each into its own flavor slot (mocha for the dark variants, latte for light).
ghostty   | templates/ghostty/ghostty.tera     | ghostty
kitty     | templates/kitty/kitty.tera         | kitty
alacritty | templates/alacritty/alacritty.tera | alacritty
starship  | templates/starship/starship.tera   | starship
btop      | templates/btop/btop.tera           | btop
tmux      | templates/tmux/tmux.tera           | tmux
slack     | templates/slack/slack.tera         | slack
zellij    | templates/zellij/zellij.tera       | zellij
delta     | templates/delta/delta.tera         | delta
fzf       | templates/fzf/fzf.tera             | fzf
lsd       | templates/lsd/lsd.tera             | lsd
# glow renders a glamour style matrix so Markdown follows the selected accent.
glow      | templates/glow/glow.tera           | glow
# bat renders the tmTheme (Sublime color scheme); also feeds the yazi syntect_theme.
bat       | templates/bat/bat.tmTheme.tera     | bat
zsh-syntax-highlighting | templates/zsh-syntax-highlighting/zsh-syntax-highlighting.tera | zsh-syntax-highlighting
# Obsidian renders a complete theme folder (theme.css + manifest.json); install
# the folder into a vault under .obsidian/themes/Nebelung/.
obsidian  | templates/obsidian/theme.tera      | obsidian/Nebelung
obsidian  | templates/obsidian/manifest.tera   | obsidian/Nebelung
# glow, lazygit and yazi carry an accent matrix — they render all 14 accents;
# consumers pick the accent folder/file they want.
lazygit   | templates/lazygit/lazygit.tera     | lazygit
yazi      | templates/yazi/yazi.tera           | yazi
# zen renders all 14 accents for mocha; install the accent folder you want.
zen       | templates/zen/userChrome.tera      | zen
zen       | templates/zen/userContent.tera     | zen
opencode  | templates/opencode/opencode.tera   | opencode
# helix renders themes/{default,no_italics}/catppuccin_<flavor>.toml — the
# no_italics variant is the same theme with the italic modifiers dropped.
helix     | templates/helix/helix.tera         | helix
# Xcode renders a .xccolortheme named after the flavor ("Catppuccin Mocha").
# The family's Swift apps are the reason this port exists here.
xcode     | templates/xcode/xcode.tera         | xcode
# gh-dash + mpv carry an accent matrix (all 14 accents per flavor), like lazygit.
gh-dash   | templates/gh-dash/gh-dash.tera     | gh-dash
mpv       | templates/mpv/mpv.tera             | mpv
# bottom (btm) — btop's sibling; renders themes/<flavor>.toml.
bottom    | templates/bottom/bottom.tera       | bottom
gitui     | templates/gitui/gitui.tera         | gitui
# micro + rio + warp: single theme file per flavor (micro also emits a
# -transparent variant).
micro     | templates/micro/micro.tera         | micro
rio       | templates/rio/rio.tera             | rio
warp      | templates/warp/warp.tera           | warp
# fish renders a dynamic + a static theme; the dynamic one is dark-only upstream
# (skip_if on light flavors), so the latte variants only get static/.
fish      | templates/fish/fish.tera           | fish
# Raycast + Dark Reader are paste-a-string ports like slack — the template
# renders a README carrying the payload (Raycast deeplink / Dark Reader config).
raycast   | templates/raycast/raycast.tera     | raycast
dark-reader | templates/dark-reader/dark-reader.tera | dark-reader
# --- editors ---
# zed renders the full accent matrix twice (with and without italics), so it is
# the widest port here: 28 theme files per flavor.
zed       | templates/zed/zed.tera             | zed
emacs     | templates/emacs/emacs.tera         | emacs
sublime-text | templates/sublime-text/sublime-text.tera | sublime-text
kakoune   | templates/kakoune/kakoune.tera     | kakoune
# JetBrains ships as a plugin: an editor color scheme (.xml) plus a UI theme
# (.theme.json), each in a plain and an -islands/-no-italics variant.
jetbrains | templates/jetbrains/editor.tera    | jetbrains
jetbrains | templates/jetbrains/ui.theme.tera  | jetbrains
# --- terminals + console ---
foot      | templates/foot/foot.tera           | foot
konsole   | templates/konsole/konsole.tera     | konsole
tabby     | templates/tabby/tabby.tera         | tabby
# xresources feeds anything reading the X colour database (xterm, urxvt, ...).
xresources | templates/xresources/xresources.tera | xresources
# --- tui + cli ---
k9s       | templates/k9s/k9s.tera             | k9s
# skim is the fzf-alike; like slack it renders a README carrying the payload.
skim      | templates/skim/skim.tera           | skim
spotify-player | templates/spotify-player/spotify-player.tera | spotify-player
zsh-fsh   | templates/zsh-fsh/zsh-fsh.tera     | zsh-fsh
# --- apps + web ---
obs       | templates/obs/obs.tera             | obs
zathura   | templates/zathura/zathura.tera     | zathura
# chroma is the Go syntax highlighter behind Hugo and friends (xml + css).
chroma    | templates/chroma/chroma.tera       | chroma
# css is the port for the web itself, and the only one with no upstream
# counterpart — Catppuccin ships its CSS from the @catppuccin/palette npm
# package, not from a whiskers template. Two files per flavor: plain custom
# properties for any stylesheet, and a Tailwind v4 `@theme` for projects that
# want utilities. Consumers take one or the other, not both.
css       | templates/css/nebelung.css.tera    | css
css       | templates/css/tailwind.css.tera    | css
# sc-im reads a plain colour file; tty renders the 16 setvtrgb console colours.
sc-im     | templates/sc-im/sc-im.tera         | sc-im
tty       | templates/tty/tty.tera             | tty
# Telegram renders the palette source for each client. Android installs as-is
# (rename to .attheme); the others are inputs to that client's packaging.
telegram  | templates/telegram/android.tera    | telegram
telegram  | templates/telegram/desktop.tera    | telegram
telegram  | templates/telegram/ios.tera        | telegram
telegram  | templates/telegram/macos.tera      | telegram
# qBittorrent renders a Qt resource dir you compile into a .qbtheme with rcc.
# icons.tera has no upstream counterpart: upstream ships those svgs static with
# stock Catppuccin baked into the fill, so we template the fill instead.
qbittorrent | templates/qbittorrent/config.tera     | qbittorrent
qbittorrent | templates/qbittorrent/stylesheet.tera | qbittorrent
qbittorrent | templates/qbittorrent/resources.tera  | qbittorrent
qbittorrent | templates/qbittorrent/icons.tera      | qbittorrent
# --- not whiskers-based; handled separately (TS builds off @catppuccin/palette) ---
# vscode  -> handled via catppuccin.colorOverrides settings snippet (scripts/gen-vscode.mjs)
# stylus  -> handled via scripts/gen-stylus.mjs (downloads/patches catppuccin userstyles)
