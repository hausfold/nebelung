[app]
overall = { bg = "#ffffff" }

[mgr]
cwd = { fg = "#2f9197" }

find_keyword  = { fg = "#d99137", italic = true }
find_position = { fg = "#e47cc7", bg = "reset", italic = true }

marker_copied   = { fg = "#4a9e3a", bg = "#4a9e3a" }
marker_cut      = { fg = "#ca2a40", bg = "#ca2a40" }
marker_marked   = { fg = "#2f9197", bg = "#2f9197" }
marker_selected = { fg = "#f66d2d", bg = "#f66d2d" }

count_copied   = { fg = "#ffffff", bg = "#4a9e3a" }
count_cut      = { fg = "#ffffff", bg = "#ca2a40" }
count_selected = { fg = "#ffffff", bg = "#f66d2d" }

border_symbol = "│"
border_style  = { fg = "#8d8d8d" }

syntect_theme = "~/.config/yazi/Catppuccin-latte.tmTheme"

[tabs]
active   = { fg = "#ffffff", bg = "#434343", bold = true }
inactive = { fg = "#434343", bg = "#c7c7c7" }

[mode]
normal_main = { fg = "#ffffff", bg = "#f66d2d", bold = true }
normal_alt  = { fg = "#f66d2d", bg = "#dadada"}

select_main = { fg = "#ffffff", bg = "#4a9e3a", bold = true }
select_alt  = { fg = "#4a9e3a", bg = "#dadada"}

unset_main  = { fg = "#ffffff", bg = "#d77c7c", bold = true }
unset_alt   = { fg = "#d77c7c", bg = "#dadada"}

[indicator]
parent = { fg = "#ffffff", bg = "#434343" }
current = { fg = "#ffffff", bg = "#f66d2d" }
preview = { fg = "#ffffff", bg = "#434343" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#4a9e3a", bg = "#c7c7c7" }
progress_error  = { fg = "#d99137", bg = "#ca2a40" }

perm_type  = { fg = "#2a6ae8" }
perm_read  = { fg = "#d99137" }
perm_write = { fg = "#ca2a40" }
perm_exec  = { fg = "#4a9e3a" }
perm_sep   = { fg = "#8d8d8d" }

[input]
border   = { fg = "#f66d2d" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#f66d2d" }
active   = { fg = "#e47cc7" }
inactive = {}

[confirm]
border     = { fg = "#f66d2d" }
title      = { fg = "#f66d2d" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#f66d2d" }

[tasks]
border  = { fg = "#f66d2d" }
title   = {}
hovered = { fg = "#e47cc7", bold = true }

[which]
mask            = { bg = "#dadada" }
cand            = { fg = "#2f9197" }
rest            = { fg = "#7b7b7b" }
desc            = { fg = "#e47cc7" }
separator       = "  "
separator_style = { fg = "#b4b4b4" }

[help]
on      = { fg = "#2f9197" }
run     = { fg = "#e47cc7" }
desc    = { fg = "#7b7b7b" }
hovered = { bg = "#b4b4b4", bold = true }
footer  = { fg = "#434343", bg = "#c7c7c7" }

[notify]
title_info  = { fg = "#2f9197" }
title_warn  = { fg = "#d99137" }
title_error = { fg = "#ca2a40" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#d99137" },
	{ mime = "{audio,video}/*", fg = "#e47cc7" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ca2a40" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#30a4de" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#c7c7c7" },

	# Special file
	{ url = "*", is = "orphan", bg = "#ca2a40" },
	{ url = "*", is = "exec"  , fg = "#4a9e3a" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "#ca2a40" },
	{ url = "*/", is = "dummy", bg = "#ca2a40" },

	# Fallback
	{ url = "*/", fg = "#f66d2d" },
]

[spot]
border = { fg = "#f66d2d" }
title  = { fg = "#f66d2d" }
tbl_cell = { fg = "#f66d2d", reversed = true }
tbl_col = { bold = true }

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#f66d2d" },
	{ name = ".git", text = "", fg = "#f66d2d" },
	{ name = ".github", text = "", fg = "#f66d2d" },
	{ name = ".npm", text = "", fg = "#f66d2d" },
	{ name = "Desktop", text = "", fg = "#f66d2d" },
	{ name = "Development", text = "", fg = "#f66d2d" },
	{ name = "Documents", text = "", fg = "#f66d2d" },
	{ name = "Downloads", text = "", fg = "#f66d2d" },
	{ name = "Library", text = "", fg = "#f66d2d" },
	{ name = "Movies", text = "", fg = "#f66d2d" },
	{ name = "Music", text = "", fg = "#f66d2d" },
	{ name = "Pictures", text = "", fg = "#f66d2d" },
	{ name = "Public", text = "", fg = "#f66d2d" },
	{ name = "Videos", text = "", fg = "#f66d2d" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#434343" },
	{ if = "link", text = "", fg = "#686868" },
	{ if = "block", text = "", fg = "#d99137" },
	{ if = "char", text = "", fg = "#d99137" },
	{ if = "fifo", text = "", fg = "#d99137" },
	{ if = "sock", text = "", fg = "#d99137" },
	{ if = "sticky", text = "", fg = "#d99137" },
	{ if = "dummy", text = "", fg = "#ca2a40" },

	# Fallback
	{ if = "dir", text = "", fg = "#f66d2d" },
	{ if = "exec", text = "", fg = "#4a9e3a" },
	{ if = "!dir", text = "", fg = "#434343" },
]
