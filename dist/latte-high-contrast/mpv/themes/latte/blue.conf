# Main mpv options
background-color='#ffffff'
osd-back-color='#eeeeee'
osd-border-color='#eeeeee'
osd-color='#434343'
osd-shadow-color='#ffffff'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=f9f9f9
script-opts-append=stats-font_color=434343
script-opts-append=stats-plot_bg_border_color=e86a2a
script-opts-append=stats-plot_bg_color=f9f9f9
script-opts-append=stats-plot_color=e86a2a

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=2a6ae8,foreground_text=dadada,background=ffffff,background_text=434343,curtain=f9f9f9,success=4a9e3a,error=ca2a40
