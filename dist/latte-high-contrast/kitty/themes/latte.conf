## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #434343
background              #ffffff
selection_foreground    #ffffff
selection_background    #d78d7d

# Cursor colors
cursor                  #d78d7d
cursor_text_color       #ffffff

# Scrollbar colors
scrollbar_handle_color  #7b7b7b
scrollbar_track_color   #c7c7c7

# URL color when hovering with mouse
url_color               #d78d7d

# Kitty window border colors
active_border_color     #7589f3
inactive_border_color   #a1a1a1
bell_border_color       #d99137

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #8545e3
inactive_tab_foreground #434343
inactive_tab_background #a1a1a1
tab_bar_background      #c7c7c7

# Colors for marks (marked text in the terminal)
mark1_foreground #ffffff
mark1_background #7589f3
mark2_foreground #ffffff
mark2_background #8545e3
mark3_foreground #ffffff
mark3_background #379eb1

