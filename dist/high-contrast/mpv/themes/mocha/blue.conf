# Main mpv options
background-color='#060606'
osd-back-color='#000000'
osd-border-color='#000000'
osd-color='#ffffff'
osd-shadow-color='#060606'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=020202
script-opts-append=stats-font_color=ffffff
script-opts-append=stats-plot_bg_border_color=f3b48d
script-opts-append=stats-plot_bg_color=020202
script-opts-append=stats-plot_color=f3b48d

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=8db4f3,foreground_text=1e1e1e,background=060606,background_text=ffffff,curtain=020202,success=abe1a6,error=ed8fa9
