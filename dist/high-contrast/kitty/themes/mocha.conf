# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #ffffff
background              #090909
selection_foreground    #090909
selection_background    #f3e1dd

# Cursor colors
cursor                  #f3e1dd
cursor_text_color       #090909

# Scrollbar colors
scrollbar_handle_color  #ababab
scrollbar_track_color   #3d3d3d

# URL color when hovering with mouse
url_color               #f3e1dd

# Kitty window border colors
active_border_color     #b5bff8
inactive_border_color   #737373
bell_border_color       #f7e2b5

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #010101
active_tab_background   #c9a8f1
inactive_tab_foreground #ffffff
inactive_tab_background #040404
tab_bar_background      #010101

# Colors for marks (marked text in the terminal)
mark1_foreground #090909
mark1_background #b5bff8
mark2_foreground #090909
mark2_background #c9a8f1
mark3_foreground #090909
mark3_background #7dc6e7

# The 16 terminal colors

# black
color0 #3d3d3d
color8 #575757

# red
color1 #ed8fa9
color9 #ed8fa9

# green
color2  #abe1a6
color10 #abe1a6

# yellow
color3  #f7e2b5
color11 #f7e2b5

# blue
color4  #8db4f3
color12 #8db4f3

# magenta
color5  #f2c4e5
color13 #f2c4e5

# cyan
color6  #9be0d5
color14 #9be0d5

# white
color7  #e3e3e3
color15 #c6c6c6
