# Main mpv options
background-color='#202020'
osd-back-color='#121212'
osd-border-color='#121212'
osd-color='#d7d7d7'
osd-shadow-color='#202020'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=191919
script-opts-append=stats-font_color=d7d7d7
script-opts-append=stats-plot_bg_border_color=dde1f3
script-opts-append=stats-plot_bg_color=191919
script-opts-append=stats-plot_color=dde1f3

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=f3e1dd,foreground_text=343434,background=202020,background_text=d7d7d7,curtain=191919,success=abe1a6,error=ed8fa9
