# Main mpv options
background-color='#1a1a1a'
osd-back-color='#0c0c0c'
osd-border-color='#0c0c0c'
osd-color='#d7d7d7'
osd-shadow-color='#1a1a1a'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=141414
script-opts-append=stats-font_color=d7d7d7
script-opts-append=stats-plot_bg_border_color=8eb5f5
script-opts-append=stats-plot_bg_color=141414
script-opts-append=stats-plot_color=8eb5f5

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=f5b58e,foreground_text=303030,background=1a1a1a,background_text=d7d7d7,curtain=141414,success=abe1a6,error=ed8fa9
