# vim:ft=kitty

## name:     Catppuccin Kitty Latte
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/latte.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #515151
background              #f1f1f1
selection_foreground    #f1f1f1
selection_background    #d78d7d

# Cursor colors
cursor                  #d78d7d
cursor_text_color       #f1f1f1

# Scrollbar colors
scrollbar_handle_color  #808080
scrollbar_track_color   #c0c0c0

# URL color when hovering with mouse
url_color               #d78d7d

# Kitty window border colors
active_border_color     #7589f3
inactive_border_color   #a1a1a1
bell_border_color       #d99137

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #f1f1f1
active_tab_background   #8545e3
inactive_tab_foreground #515151
inactive_tab_background #a1a1a1
tab_bar_background      #c0c0c0

# Colors for marks (marked text in the terminal)
mark1_foreground #f1f1f1
mark1_background #7589f3
mark2_foreground #f1f1f1
mark2_background #8545e3
mark3_foreground #f1f1f1
mark3_background #379eb1

# The 16 terminal colors

# black
color0 #616161
color8 #717171

# red
color1 #ca2a40
color9 #ca2a40

# green
color2  #4a9e3a
color10 #4a9e3a

# yellow
color3  #d99137
color11 #d99137

# blue
color4  #2a6ae8
color12 #2a6ae8

# magenta
color5  #e47cc7
color13 #e47cc7

# cyan
color6  #2f9197
color14 #2f9197

# white
color7  #b0b0b0
