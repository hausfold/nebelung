# Main mpv options
background-color='#f1f1f1'
osd-back-color='#e0e0e0'
osd-border-color='#e0e0e0'
osd-color='#515151'
osd-shadow-color='#f1f1f1'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=e9e9e9
script-opts-append=stats-font_color=515151
script-opts-append=stats-plot_bg_border_color=dea430
script-opts-append=stats-plot_bg_color=e9e9e9
script-opts-append=stats-plot_color=dea430

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=30a4de,foreground_text=d0d0d0,background=f1f1f1,background_text=515151,curtain=e9e9e9,success=4a9e3a,error=ca2a40
