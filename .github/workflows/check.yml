name: check

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — a runner the next PR then waits
# behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build + dist drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action purges its own older entries through the API.
      actions: write
    steps:
      - uses: actions/checkout@v4
      # whiskers, the Rust CLI that renders every port, is in neither nixpkgs
      # nor cache.nixos.org, so a miss on the store cache below builds it from
      # source: a rustc toolchain closure and 218 seconds to render text files.
      # Catppuccin publishes it to its own cachix, signed, and the x86_64-linux
      # path these runs need is there — so a miss downloads 2.2 MB of zstd
      # (6.9 MB unpacked) instead. Coverage there is not total: x86_64-darwin
      # 404s, which costs nothing while this job is the only one that builds.
      #
      # Read-only and public: no account and no token. That is a different
      # trade from the hosted cache workshop's docs/ci.md rules out, and the
      # carve-out saying so is hausfold/workshop#581 — until it lands, this
      # step is an exception to a rule that does not yet name it. The part that
      # is not free: `trusted-public-keys` is not per-path, so catppuccin's key
      # can supply ANY path in this job, not only whiskers.
      #
      # A substituter that is down is not a failure. Nix falls back to
      # building, which is what every run does today; an unreachable endpoint
      # costs a connect timeout per query, not a red run. The key is published
      # at https://app.cachix.org/api/v1/cache/catppuccin, `extra-` adds to
      # cache.nixos.org rather than replacing it, and cachix answers Priority
      # 41 against cache.nixos.org's 40, so nothing else moves cache.
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-substituters = https://catppuccin.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=
      # The two halves split the two cases: the substituter above makes a MISS
      # cheap, this makes a HIT free — no download, and none of the render's
      # own dependencies either. The key is the flake inputs, so a palette edit
      # reuses that build and pays only for the render; a lock bump is the only
      # thing that pays in full.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Only a push to main writes a cache, and this line is what makes
          # that true — GitHub's ref scoping governs READS, not writes. Left on
          # the default, every PR would upload its own multi-gigabyte copy
          # scoped to `refs/pull/N/merge`, two open PRs would push the repo past
          # GitHub's 10 GB budget, and its LRU eviction would take the main
          # entry this whole thing exists for.
          save: ${{ github.event_name != 'pull_request' }}
          # One store entry per ref, not one per key we have ever had. The
          # sweep runs AFTER the save, not before: it takes every `nix-<os>-`
          # entry created before this job's post phase, which the one just
          # written is not. `purge-primary-key: never` is what keeps the pass
          # that DOES run first off the entry being reused when the key
          # already hits. Both are scoped to the run's own ref, so a PR can
          # only ever reach its own.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          # No `gc-max-store-size-*`: `nix build` roots its own outputs through
          # `./result` but NOT the flake inputs or the source derivations, so a
          # collector run before the save would take exactly the paths the next
          # run wants. The store is saved whole and carries forward, which the
          # ceiling can afford — the action logs `Current store size in bytes`
          # on the runs that save, and `gh cache list --repo hausfold/nebelung`
          # reports the compressed entry the 10 GB actually counts.
      - run: nix build .#default .#nebelung-skill --print-build-logs
      # dist/ is committed for non-nix users; it must always equal what the
      # flake builds from palette + templates. Compare both directions:
      # every committed file matches, and nothing rendered is missing.
      #
      # The `find` filter below excludes the REFERENCE files the package ships
      # alongside the rendered ports — the per-variant previews, the palette hex
      # maps, variants.json (the render manifest), and ports.meta.json (install
      # metadata). They live in the repo root rather than under dist/, so they're
      # legitimately absent from it.
      - name: dist/ matches the built output
        run: |
          fail=0
          while IFS= read -r f; do
            cmp -s "dist/$f" "result/$f" || { echo "::error::dist/$f differs from the built output"; fail=1; }
          done < <(cd dist && find . -type f)
          while IFS= read -r f; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f is missing (rendered but not committed)"; fail=1; }
          done < <(cd result && find . -type f -not -path './preview/*' -not -name 'nebelung*.json' -not -name 'variants.json' -not -name 'ports.meta.json')
          [ "$fail" = 0 ] && echo "dist/ is in sync"
          exit "$fail"
      # The previews are what GitHub Pages publishes, so a template edit that
      # never had ./build.sh run on it would put a stale page on the web.
      # preview/index.html is hand-written and rendered by nothing — it has no
      # counterpart in the build output, which is why this walks the output side.
      - name: preview/ matches the built output
        run: |
          fail=0
          for f in result/preview/*.html; do
            b="$(basename "$f")"
            cmp -s "preview/$b" "$f" || { echo "::error::preview/$b differs from the built output"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "preview/ is in sync"
          exit "$fail"

  unit:
    name: palette unit tests + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pure OKLCH math + drift guard; no nix needed, so this gives fast
      # feedback on the palette logic ahead of the full build job above.
      - name: node --test
        run: node --test
      # shellcheck is on the runner image already; apt-get update alone was
      # costing more than the check it installed.
      - name: shellcheck
        run: |
          # From the runner image, not apt — so print the version: an image
          # change that drops it or moves it (24.04 ships 0.9.0, 26.04 ships
          # 0.11.0, and they disagree about SC2015) must read as a version
          # change here rather than as a line nobody touched.
          shellcheck --version
          shellcheck build.sh
